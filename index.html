<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinnkey Studio</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f5f5f5;
      color:#222;
    }

    .container{
      max-width:900px;
      margin:auto;
      padding:60px 20px;
      text-align:center;
    }

    h1{
      font-size:42px;
      margin-bottom:10px;
    }

    p{
      font-size:18px;
      line-height:1.7;
      color:#555;
    }

    .card{
      background:white;
      padding:30px;
      border-radius:16px;
      margin-top:30px;
      box-shadow:0 5px 20px rgba(0,0,0,0.08);
    }

    .btn{
      display:inline-block;
      margin-top:20px;
      padding:12px 24px;
      background:#111;
      color:white;
      text-decoration:none;
      border-radius:10px;
    }

    footer{
      margin-top:50px;
      color:#777;
      font-size:14px;
    }
  </style>
</head>
<body>

  <div class="container">

    <h1>Pinnkey Studio</h1>

    <p>
      Creative digital workspace for web services, automation,
      AI tools, and online solutions.
    </p>

    <div class="card">
      <h2>About</h2>

      <p>
        We provide simple digital services and modern online
        solutions for creators and businesses.
      </p>

      <a href="mailto:hello@studio.pinnkey.web.id" class="btn">
        Contact Us
      </a>
    </div>

    <footer>
      © 2026 Pinnkey Studio
    </footer>

  </div>

</body>
</html>
